<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>favdotcom 4rm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .ui { position: fixed; pointer-events: none; font-family: "DotGothic16", "MS Gothic", "WenQuanYi Zen Hei", "Noto Sans CJK JP", sans-serif; color: #ff1414; font-weight: bold; }
  #letters { font-family: "UnifrakturMaguntia", serif; font-weight: normal; top: 14px; left: 0; right: 0; text-align: center; font-size: 34px; letter-spacing: 14px; text-shadow: 2px 2px 0 #000; }
  #letters span { opacity: .22; color: #fff; }
  #letters span.got { opacity: 1; color: #ff1414; }
  #jp { top: 60px; left: 16px; font-size: 18px; text-shadow: 1px 1px 0 #000; }
  #arrow { top: 64px; right: 18px; width: 54px; height: 54px; font-size: 44px; line-height: 54px; text-align: center; color: #fff; text-shadow: 2px 2px 0 #000; transition: transform .1s linear; }
  #dialog { font-weight: normal; letter-spacing: .04em; bottom: 9vh; left: 6vw; right: 6vw; text-align: center; font-size: clamp(16px, 3.4vw, 26px); text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; transition: opacity .6s; opacity: 0; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .9s ease-in-out; }
  #start, #end { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px;
    background: radial-gradient(#3a0008, #000 75%); color: #fff; font-family: "Times New Roman", serif; cursor: pointer; padding: 16px; box-sizing: border-box; }
  #start h1, #end h1 { margin: 0; font-family: "UnifrakturMaguntia", serif; font-weight: normal; font-size: clamp(44px, 12vw, 104px); letter-spacing: .04em; color: #dfe6ff;
    text-shadow: 0 2px 0 #8a9ad8, 0 4px 0 #3a4a90, 0 6px 0 #101a40, 0 10px 18px #000; }
  #start h2, #end h2 { margin: 0; font-size: clamp(22px, 6vw, 40px); color: #ff1414; font-family: "DotGothic16", "WenQuanYi Zen Hei", sans-serif; }
  #start p, #end p { margin: 0; max-width: 560px; font: 16px/1.6 "DotGothic16", "WenQuanYi Zen Hei", sans-serif; color: #ddd; }
  #start .go { color: #ff1414; font: 22px "DotGothic16", sans-serif; animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #end { display: none; cursor: default; background: rgba(0,0,0,.55); }
  #joy { position: fixed; left: 26px; bottom: 26px; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,20,20,.5); display: none; pointer-events: none; }
  #joy i { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,20,20,.6); }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; color: #ff1414; font: 22px "DotGothic16", "WenQuanYi Zen Hei", sans-serif; z-index: 10; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="letters"><span>F</span><span>A</span><span>V</span><span>.</span></div>
<div class="ui" id="jp">ファブドットコム</div>
<div class="ui" id="arrow">↑</div>
<div class="ui" id="dialog"></div>
<div id="joy"><i></i></div>
<div id="fade"></div>
<div id="start">
  <h1>FAVDOTCOM</h1>
  <h2>４ＲＭ</h2>
  <p>WASD / стрелки — идти, мышь — смотреть, Shift — бежать.<br>На телефоне: джойстик слева, свайп справа.</p>
  <div class="go">нажми, чтобы проснуться</div>
</div>
<div id="end">
  <h1>FAVDOTCOM</h1>
  <h2>４ＲＭ</h2>
  <p id="endtext"></p>
</div>
<div id="loading">загрузка… ファブドットコム</div>
<script type="module" src="./src/game.js"></script>
</body>
</html>
